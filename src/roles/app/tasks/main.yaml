---
- name: Download the binary file to remote server
  ansible.builtin.get_url:
    url: "https://github.com/Filin7770/url-shortener/releases/download/v1.0.0/url-shortener"
    dest: /usr/local/bin/url-shortener
    owner: root
    group: root
    mode: "0755"

- name: Create directory for static file
  ansible.builtin.file:
    path: /var/www/url-shortener
    state: directory
    mode: "0755"
    owner: www-data
    group: www-data

- name: Download the static file to remote server
  ansible.builtin.get_url:
    url: "https://github.com/Filin7770/url-shortener/releases/download/v1.0.0/index.html"
    dest: /var/www/url-shortener/index.html
    owner: www-data
    group: www-data
    mode: "0755"

- name: Copy the unit file to remote server
  ansible.builtin.copy:
    src: ./files/url-shortener.service
    dest: /etc/systemd/system/url-shortener.service
    owner: root
    group: root
    mode: "0755"
  notify:
    - Reload systemd daemon
    - Start url-shortener service

- name: Enable url-shortener service
  ansible.builtin.systemd:
    name: url-shortener.service
    enabled: yes

- name: Check if url-shortener service is running
  ansible.builtin.systemd:
    name: url-shortener.service
    state: started
  check_mode: no
  register: service_status
  failed_when: service_status.state != 'started'