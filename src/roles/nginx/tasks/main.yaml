---
- name: Update the repository cache and install nginx
  ansible.builtin.apt:
    name: nginx
    state: latest
    update_cache: yes
  become: yes

- name: Install OpenSSL
  ansible.builtin.apt:
    name: openssl
    state: present
    update_cache: yes
  become: yes

- name: Create directory for SSL certificates
  ansible.builtin.file:
    path: /etc/nginx/ssl
    state: directory
    mode: "0700"
    owner: root
    group: root
  become: yes

# Сертификаты для url-shortener
- name: Check if SSL certificate for url-shortener exists
  ansible.builtin.stat:
    path: "{{ nginx_config.url_shortener_ssl_cert_path }}"
  register: url_shortener_ssl_cert

- name: Generate private key for url-shortener SSL certificate
  ansible.builtin.openssl_privatekey:
    path: "{{ nginx_config.url_shortener_ssl_key_path }}"
    size: 2048
    type: RSA
    mode: "0600"
  when: not url_shortener_ssl_cert.stat.exists
  become: yes
  notify: Reload nginx

- name: Generate CSR for url-shortener SSL certificate
  ansible.builtin.openssl_csr:
    path: /tmp/url-shortener.csr
    privatekey_path: "{{ nginx_config.url_shortener_ssl_key_path }}"
    country_name: "RU"
    state_or_province_name: "State"
    locality_name: "City"
    organization_name: "Organization"
    organizational_unit_name: "Unit"
    common_name: "{{ nginx_config.url_shortener_server_name.split()[0] }}"
  when: not url_shortener_ssl_cert.stat.exists
  become: yes

- name: Generate self-signed SSL certificate for url-shortener
  ansible.builtin.openssl_certificate:
    path: "{{ nginx_config.url_shortener_ssl_cert_path }}"
    privatekey_path: "{{ nginx_config.url_shortener_ssl_key_path }}"
    csr_path: /tmp/url-shortener.csr
    provider: selfsigned
    selfsigned_not_after: "+365d"
    mode: "0644"
  when: not url_shortener_ssl_cert.stat.exists
  become: yes
  notify: Reload nginx

- name: Remove temporary CSR file for url-shortener
  ansible.builtin.file:
    path: /tmp/url-shortener.csr
    state: absent
  when: not url_shortener_ssl_cert.stat.exists
  become: yes

# Сертификаты для WordPress
- name: Check if SSL certificate for WordPress exists
  ansible.builtin.stat:
    path: "{{ nginx_config.wordpress_ssl_cert_path }}"
  register: wordpress_ssl_cert

- name: Generate private key for WordPress SSL certificate
  ansible.builtin.openssl_privatekey:
    path: "{{ nginx_config.wordpress_ssl_key_path }}"
    size: 2048
    type: RSA
    mode: "0600"
  when: not wordpress_ssl_cert.stat.exists
  become: yes
  notify: Reload nginx

- name: Generate CSR for WordPress SSL certificate
  ansible.builtin.openssl_csr:
    path: /tmp/wordpress.csr
    privatekey_path: "{{ nginx_config.wordpress_ssl_key_path }}"
    country_name: "RU"
    state_or_province_name: "State"
    locality_name: "City"
    organization_name: "Organization"
    organizational_unit_name: "Unit"
    common_name: "{{ nginx_config.wordpress_server_name }}"
  when: not wordpress_ssl_cert.stat.exists
  become: yes

- name: Generate self-signed SSL certificate for WordPress
  ansible.builtin.openssl_certificate:
    path: "{{ nginx_config.wordpress_ssl_cert_path }}"
    privatekey_path: "{{ nginx_config.wordpress_ssl_key_path }}"
    csr_path: /tmp/wordpress.csr
    provider: selfsigned
    selfsigned_not_after: "+365d"
    mode: "0644"
  when: not wordpress_ssl_cert.stat.exists
  become: yes
  notify: Reload nginx

- name: Remove temporary CSR file for WordPress
  ansible.builtin.file:
    path: /tmp/wordpress.csr
    state: absent
  when: not wordpress_ssl_cert.stat.exists
  become: yes

- name: Remove default site from sites-enabled if exists
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: yes
  notify: Reload nginx

- name: Deploy nginx configuration from template
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/url-shortener.conf
    owner: root
    group: root
    mode: "0644"
  become: yes
  notify: Reload nginx

- name: Create symlink in sites-enabled for url-shortener
  ansible.builtin.file:
    src: /etc/nginx/sites-available/url-shortener.conf
    dest: /etc/nginx/sites-enabled/url-shortener.conf
    state: link
  become: yes
  notify: Reload nginx

- name: Add domains to /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item }}"
    state: present
  loop:
    - "192.168.56.10 221337.ru"
    - "192.168.56.10 17228.ru"
  become: yes

- name: Test full Nginx configuration
  ansible.builtin.command:
    cmd: nginx -t
  register: nginx_test
  failed_when: nginx_test.rc != 0
  changed_when: false
  become: yes

- name: Ensure nginx is running
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: yes
  become: yes